*{box-sizing:border-box}body{margin:0;background:#101512;color:#ede1ca;font:14px system-ui,sans-serif}header{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 26px;border-bottom:1px solid #8e785242}header a{color:#d7be8d;text-decoration:none}h1{font:700 30px Georgia,serif;margin:4px 0}small,.muted{color:#b4b6a6}.layout{display:grid;grid-template-columns:minmax(250px,300px) 1fr;min-height:calc(100dvh - 84px)}aside{padding:19px;background:#1d241e;border-right:1px solid #8d795248;max-height:calc(100dvh - 84px);overflow:auto}label{display:grid;grid-template-columns:1fr 1fr;align-items:center;gap:8px;margin:9px 0}select,button{background:#282d23;color:#ead7b3;border:1px solid #8b7753;border-radius:5px;padding:9px;font:inherit}button{cursor:pointer}button.active{background:#b39965;color:#10150e}button:hover{border-color:#f6d392}button:disabled{opacity:.4}#stage{position:relative;min-height:520px;height:calc(100dvh - 84px);overflow:hidden}canvas{display:block;touch-action:none}.tools{position:absolute;bottom:15px;left:50%;transform:translateX(-50%);display:flex;gap:7px;flex-wrap:wrap;justify-content:center;width:min(95%,620px)}#status{position:absolute;top:15px;left:15px;background:#111811e8;border:1px solid #917e554f;padding:12px;max-width:85%;line-height:1.4;border-radius:6px}.checks{margin-top:17px;line-height:1.5;font-size:12px}.kicker{letter-spacing:.15em;font-size:10px;color:#d8b67d}.buttons{display:flex;gap:6px;margin-top:15px}.buttons button{flex:1}p{line-height:1.5}@media(max-width:720px){header{padding:10px 14px}h1{font-size:22px}.layout{display:flex;flex-direction:column-reverse}#stage{height:57dvh;min-height:360px}aside{max-height:none;border:0;padding:15px}.tools button{font-size:12px;padding:7px}#status{font-size:11px;padding:6px}}
 .detail-section{margin:10px 0;border:1px solid #8b775344;border-radius:6px;padding:8px}.detail-section summary{cursor:pointer;color:#e7c992;font-weight:600;font-size:12px}.morph-row{display:block;margin:9px 0}.morph-row span{display:flex;justify-content:space-between;font-size:12px;gap:8px}.morph-row input{width:100%;accent-color:#bd9d62;margin:7px 0 0}.morph-row output{color:#e4c183;font-variant-numeric:tabular-nums}#save-look{background:#a58a55;color:#141911;font-weight:700}</style></head><body><header><div><div class="kicker">MEDUSA GAMES / DEVELOPMENT LAB</div><h1>Ashborn · Character Studio</h1></div><a href="index.html?v=9">Torna al gioco ›</a></header><main class="layout"><aside><div class="kicker">PERSONALIZZAZIONE</div><label>Stile iniziale<select id="preset"><option value="">Scegli un preset</option><option value="explorer">Esploratore</option><option value="warrior">Guerriero</option><option value="elder">Anziano del clan</option></select></label><div id="choices"></div><div id="advanced"></div><label>Equipaggiamento<select id="equipment"><option value="0">Cuoio iniziale</option><option value="1">Tunica e calzari</option><option value="2">Mantello e calzari</option></select></label><div class="buttons"><button id="random">Casuale</button><button id="reset">Ripristina</button></div><div class="buttons"><button id="save-look">Salva aspetto per il gioco</button></div><p id="saved-look" role="status" class="muted"></p><div class="checks" id="checks">Verifica in corso...</div><p class="muted">Stesso modello e stesso scheletro del gioco. Le modifiche di questo laboratorio non cambiano il tuo salvataggio.</p></aside><section id="stage"><div id="status" role="status">Caricamento geometria...</div><div class="tools"><button data-pose="idle" class="active">Riposo</button><button data-pose="walk">Cammina</button><button data-pose="run">Corri</button><button data-pose="jump">Salta</button><button data-pose="attack">Attacco</button><button id="close">Volto</button><bu import {createVisuals} from './visuals.js?v=6';

const $=s=>document.getElementById(s),stage=$('stage'),status=$('status');

let ch=normalizeDetails({...DEFAULT_CHARACTER}),pending=false,actor,root,pose='idle',angle=.30,spin=false,close=false,wire=false,drag=null,phase=0,previous=performance.now(),shaderError=false;
try{

const scene=new T.Scene();scene.background=new T.Color(0x26332c);const camera=new T.PerspectiveCamera(35,1,.05,60),vis=createVisuals(T,renderer,false);scene.add(new T.HemisphereLight(0xf7e4c1,0x425a55,2.05));const sun=new T.DirectionalLight(0xffe6c7,3.2);sun.position.set(-3,6,4);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);sun.shadow.camera.left=sun.shadow.camera.bottom=-4;sun.shadow.camera.right=sun.shadow.camera.top=4;sun.shadow.normalBias=.025;scene.add(sun);const rim=new T.DirectionalLight(0xb2d9e6,1.5);rim.position.set(4,4,-4);scene.add(rim);
const floor=new T.Mesh(new T.CircleGeometry(12,80),new T.MeshStandardMaterial({color:0x39463b,roughness:1}));floor.rotation.x=-Math.PI/2;floor.position.y=-.022;floor.receiveShadow=true;scene.add(floor);
const skins=[0xe2b58e,0xbf8e61,0x895a3c,0x5b392b],hairs=[0x3b281d,0x211c1a,0x8c5833,0xc0a16b,0xa1a4a1];
function refresh(){if(root){scene.remove(root);actor.dispose()}root=new T.Group();root.scale.y=heightScale(ch);scene.add(root);const e=Number($('equipment').value);actor=createCharacter(T,vis,ch,{tunic:e===1,boots:e>0,wintercoat:e===2},root,skins[ch.skin],hairs[ch.hairColor]);root.rotation.y=angle;let ok=true;for(const m of [actor.mesh,...actor.attachments]){ok=ok&&m.skeleton===actor.skeleton;const p=m.geometry.attributes.position,w=m.geometry.attributes.skinWeight;for(let i=0;i<p.count;i++){if(!Number.isFinite(p.getX(i)+p.getY(i)+p.getZ(i))||Math.abs(w.getX(i)+w.getY(i)+w.getZ(i)+w.getW(i)-1)>.005)ok=false}}$('checks').textContent=characterInfo.vertices.toLocaleString('it-IT')+' vertici anatomici · '+characterInfo.bones+' ossa · '+actor.attachments.length+' componenti collegati · '+(ok?'Pesi scheletrici verificati':'ERRORE GEOMETRIA');root.traverse(m=>{if(m.isMesh)for(const mat of [].concat(m.material))mat.wireframe=wire})}
for(const [k,values] of Object.entries(options)){const l=document.createElement('label'),s=document.createElement('select');l.textContent=names[k];s.id='choice-'+k;for(let i=0;i<values.length;i++){const o=document.createElement('option');o.value=i;o.textContent=values[i];s.append(o)}s.value=ch[k];s.onchange=()=>{ch[k]=+s.value;refresh()};l.append(s);$('choices').append(l)}
mountDetails($('advanced'),ch,(k,v,focus)=>{ch[k]=v;close=focus==='face';spin=false;angle=.08;$('close').classList.toggle('active',close);$('spin').classList.remove('active');pending=true});function sync(){for(const k of Object.keys(options))$('choice-'+k).value=ch[k];syncDetails($('advanced'),ch);refresh()}$('preset').onchange=()=>{if($('preset').value){ch=applyPreset(ch,$('preset').value);$('preset').value='';sync()}};$('save-look').onclick=()=>{try{localStorage.setItem('ashborn-character-draft-v1',JSON.stringify(normalizeDetails(ch)));$('saved-look').textContent='Aspetto salvato. Apri Ashborn e premi IMPORTA ASPETTO DALLO STUDIO.'}catch{$('saved-look').textContent='Salvataggio non disponibile in questo browser.'}};$('random').onclick=()=>{for(const [k,v] of Object.entries(options))ch[k]=Math.floor(Math.random()*v.length);randomDetails(ch);sync()};$('reset').onclick=()=>{ch={...DEFAULT_CHARACTER,...DETAIL_DEFAULTS};sync()};$('equipment').onchange=refresh;
for(const b of document.querySelectorAll('[data-pose]'))b.onclick=()=>{pose=b.dataset.pose;phase=0;for(const t of document.querySelectorAll('[data-pose]'))t.classList.toggle('active',b===t)};
$('close').onclick=()=>{close=!close;$('close').classList.toggle('active',close);if(close){angle=.08;spin=false;$('spin').classList.remove('active')}};$('spin').onclick=()=>{spin=!spin;$('spin').classList.toggle('active',spin)};$('wire').onclick=()=>{wire=!wire;$('wire').classList.toggle('active',wire);root.traverse(m=>{if(m.isMesh)for(const mat of [].concat(m.material))mat.wireframe=wire})};const c=renderer.domElement;c.onpointerdown=e=>{drag=e.clientX;c.setPointerCapture(e.pointerId);spin=false;$('spin').classList.remove('active')};c.onpointermove=e=>{if(drag!==null){angle+=(e.clientX-drag)*.012;drag=e.clientX}};c.onpointerup=c.onpointercancel=()=>{drag=null};
function resize(){renderer.setSize(stage.clientWidth,stage.clientHeight);camera.aspect=stage.clientWidth/stage.clientHeight;camera.updateProjectionMatrix()}new ResizeObserver(resize).observe(stage);refresh();resize();
let first=true;function frame(now){if(pending){pending=false;refresh()}const dt=Math.min(.05,Math.max(0,(now-previous)/1000));previous=now;phase+=dt*(pose==='run'?12:8);if(spin)angle+=dt*.5;root.rotation.y=angle;const jumping=pose==='jump',height=jumping?Math.abs(Math.sin(now*.003))*.8:0;root.position.y=height;actor.animate(phase,pose==='run'?6.8:pose==='walk'?3.6:0,jumping,pose==='attack'?Math.max(0,Math.sin(now*.005)):0,now/1000);const target=(close?2.1:1.15)*root.scale.y+height;camera.position.set(0,target+(close?.025:.24),close?.88:4.4*Math.max(1,0.7/camera.aspect));camera.lookAt(0,target,0);renderer.render(scene,camera);if(first){first=false;const gl=renderer.getContext(),error=gl.getError();status.textContent=shaderError||error!==gl.NO_ERROR?'Errore WebGL '+error:'WebGL attivo · primo frame renderizzato'}requestAnimationFrame(frame)}requestAnimationFrame(frame)
}catch(e){status.textContent='Impossibile avviare il modello: '+e.message;console.error(e)}
</script></body></html>
